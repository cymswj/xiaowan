<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a3a4a" />
  <title>小万 · 万国助手</title>
  <meta name="description" content="小万：三亚接机、翻译、用车，也可帮订万国酒店和万国公寓。" />
  <style>
    :root {
      --bg: #f3eee4;
      --ink: #1a3340;
      --muted: #5d6e76;
      --paper: #fffdf8;
      --line: #e4d9c8;
      --sea: #1a3a4a;
      --brass: #b8924a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
    body {
      font: 16px/1.5 "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
      display: flex; flex-direction: column;
    }
    header {
      flex: none;
      background: var(--sea);
      color: var(--paper);
      padding: 16px 18px 12px;
      padding-top: max(16px, env(safe-area-inset-top));
    }
    .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .brand { margin: 0; font-size: 11px; letter-spacing: .18em; color: var(--brass); }
    h1 { margin: 6px 0 0; font-size: 26px; font-weight: 650; }
    .sub { margin: 4px 0 0; opacity: .85; font-size: 13px; }
    .lang {
      border: 1px solid rgba(255,253,248,.35);
      background: transparent;
      color: var(--paper);
      border-radius: 999px;
      padding: 6px 10px;
      font: inherit;
      font-size: 12px;
    }
    .log {
      flex: 1;
      overflow: auto;
      padding: 16px 16px 8px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      max-width: 86%;
      padding: 10px 12px;
      border-radius: 16px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .bot { align-self: flex-start; background: var(--paper); border: 1px solid var(--line); }
    .me { align-self: flex-end; background: var(--sea); color: var(--paper); }
    .hint { align-self: center; color: var(--muted); font-size: 12px; text-align: center; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 8px; }
    .chips button, .orderbar button, .sheet button {
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--ink);
      border-radius: 999px;
      padding: 7px 12px;
      font: inherit;
      font-size: 13px;
    }
    .orderbar { padding: 0 16px 8px; display: flex; gap: 8px; }
    .orderbar button.main, form.bar button, .sheet .go {
      border: 0;
      background: var(--sea);
      color: var(--paper);
      border-radius: 14px;
      font-weight: 700;
    }
    form.bar {
      flex: none;
      display: flex;
      gap: 8px;
      padding: 10px 16px calc(12px + env(safe-area-inset-bottom));
      background: var(--paper);
      border-top: 1px solid var(--line);
    }
    textarea, .sheet input, .sheet select {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--bg);
      border-radius: 12px;
      padding: 10px 12px;
      font: inherit;
    }
    form.bar textarea { flex: 1; resize: none; min-height: 44px; max-height: 120px; width: auto; }
    form.bar button { min-width: 72px; }
    form.bar button:disabled { opacity: .5; }
    .err { color: #8a3030; font-size: 13px; }
    footer { text-align: center; color: var(--muted); font-size: 11px; padding: 0 16px 8px; }
    .sheet {
      display: none;
      padding: 0 16px 8px;
    }
    .sheet.open { display: grid; gap: 8px; }
    .sheet label { font-size: 12px; color: var(--muted); }
    a { color: inherit; }
  </style>
</head>
<body>
  <header>
    <div class="top">
      <div>
        <p class="brand" id="brand">海南万国大健康</p>
        <h1 id="title">小万</h1>
        <p class="sub" id="sub">先说在哪、哪天到。凌晨航班也能接。</p>
      </div>
      <button class="lang" type="button" id="langBtn">RU</button>
    </div>
  </header>

  <div id="log" class="log"></div>
  <div id="chips" class="chips"></div>
  <div class="orderbar">
    <button type="button" class="main" id="openOrder">发给接待</button>
  </div>
  <div class="sheet" id="sheet">
    <label id="lDate">日期 / 航班</label>
    <input id="fWhen" placeholder="10月3日  SU204  02:10" />
    <label id="lWho">人数</label>
    <input id="fWho" placeholder="2 成人" />
    <label id="lWhere">在哪</label>
    <select id="fWhere">
      <option value="三亚">三亚</option>
      <option value="海口">海口</option>
      <option value="博鳌">博鳌</option>
    </select>
    <label id="lNeed">要什么</label>
    <input id="fNeed" placeholder="接机 + 送到大东海" />
    <button type="button" class="go" id="copyOrder">复制并打开 Telegram</button>
  </div>

  <form class="bar" id="form">
    <textarea id="input" rows="1" placeholder="在哪、哪天到、要什么"></textarea>
    <button type="submit" id="send">发送</button>
  </form>
  <footer>Telegram / WhatsApp @pczZJ · +86 138 7663 6537</footer>

  <script>
    const KEY = "sk-18a86ed64055424aa11284d4ffc58c3b";
    const RULES = [
      "你是小万，海南万国大健康投资有限公司的客服助手。",
      "用客人使用的语言回答。中文就中文，俄语就俄语，短句，不客套堆砌。",
      "开场先问：人在哪或要去哪（三亚/海口/博鳌）、哪天到、要住还是只要车。",
      "三亚客人先说接机翻译送到湾区；海口先说万国酒店；博鳌先说公寓和食府。不要一次报完所有地方。",
      "凌晨和夜班航班可以接，问航班号和到达时间。",
      "万国购只给 https://www.wggi.cc/ ，不编商品和免税。",
      "下面「已教内容」优先。不知道空房或价格时不要编数字。",
      "联系人 Telegram / WhatsApp @pczZJ，电话 +86 138 7663 6537。",
      "客人问干细胞、血液净化、糖尿病、高血压、体检、抗衰、口腔、皮肤、中医或任何治疗性、功能性项目：同一套说法。可以找推荐人 @pczZJ 或电话 +86 138 7663 6537；另外我们还做落地接待、住宿、用餐、用车；可帮车和翻译去有牌照的机构，治疗项目费付给机构。日期、人数发给推荐人。不要说「不接诊，也不安排治疗」。不解释疗效，不编医院名，不比较项目好坏。",
    ].join("");

    const UI = {
      zh: {
        brand: "海南万国大健康",
        title: "小万",
        sub: "先说在哪、哪天到。凌晨航班也能接。",
        lang: "RU",
        hi: "我是小万。先告诉我：你在三亚、海口还是博鳌？哪天到？要接机、住宿，还是只要车？",
        ph: "在哪、哪天到、要什么",
        send: "发送",
        order: "发给接待",
        copy: "复制并打开 Telegram",
        chips: ["三亚接机", "凌晨航班", "海口酒店", "博鳌公寓", "万国购"],
        lDate: "日期 / 航班",
        lWho: "人数",
        lWhere: "在哪",
        lNeed: "要什么"
      },
      ru: {
        brand: "Хайнань Ваньго",
        title: "Сяо Вань",
        sub: "Сначала: где вы и когда прилёт. Ночные рейсы тоже встречаем.",
        lang: "中文",
        hi: "Я Сяо Вань. Напишите: Санья, Хайкоу или Боао? Дата прилёта? Трансфер, жильё или только машина?",
        ph: "Где вы, дата, что нужно",
        send: "Отправить",
        order: "Отправить приёму",
        copy: "Скопировать и открыть Telegram",
        chips: ["Трансфер Санья", "Ночной рейс", "Отель Хайкоу", "Апартаменты Боао", "Wanguogou"],
        lDate: "Дата / рейс",
        lWho: "Сколько человек",
        lWhere: "Где",
        lNeed: "Что нужно"
      }
    };

    let lang = /[а-яё]/i.test(navigator.language || "") ? "ru" : "zh";
    const logEl = document.getElementById("log");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const chipsEl = document.getElementById("chips");
    const history = [{ role: "system", content: RULES }];

    function t() { return UI[lang]; }
    function paint() {
      const u = t();
      document.documentElement.lang = lang === "ru" ? "ru" : "zh-CN";
      document.getElementById("brand").textContent = u.brand;
      document.getElementById("title").textContent = u.title;
      document.getElementById("sub").textContent = u.sub;
      document.getElementById("langBtn").textContent = u.lang;
      document.getElementById("openOrder").textContent = u.order;
      document.getElementById("copyOrder").textContent = u.copy;
      document.getElementById("lDate").textContent = u.lDate;
      document.getElementById("lWho").textContent = u.lWho;
      document.getElementById("lWhere").textContent = u.lWhere;
      document.getElementById("lNeed").textContent = u.lNeed;
      input.placeholder = u.ph;
      sendBtn.textContent = u.send;
      chipsEl.innerHTML = "";
      u.chips.forEach(function (c) {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = c;
        b.onclick = function () { input.value = c; ask(c); };
        chipsEl.appendChild(b);
      });
    }

    function add(role, text, cls) {
      const div = document.createElement("div");
      div.className = "msg " + (cls || (role === "user" ? "me" : "bot"));
      div.textContent = text;
      logEl.appendChild(div);
      logEl.scrollTop = logEl.scrollHeight;
    }

    function localFacts() {
      try {
        return (JSON.parse(localStorage.getItem("xiaowan_kb") || "[]") || [])
          .map(function (x) { return x && x.text; })
          .filter(Boolean);
      } catch (e) { return []; }
    }
    async function publishedFacts() {
      try {
        const res = await fetch("./knowledge.json?t=" + Date.now());
        if (!res.ok) return [];
        const data = await res.json();
        return data.items || [];
      } catch (e) { return []; }
    }
    function applyKnowledge(items) {
      const extra = items.filter(Boolean);
      history[0].content = RULES + (extra.length ? "\n\n已教内容：\n- " + extra.join("\n- ") : "");
    }

    document.getElementById("langBtn").onclick = function () {
      lang = lang === "zh" ? "ru" : "zh";
      paint();
    };
    document.getElementById("openOrder").onclick = function () {
      document.getElementById("sheet").classList.toggle("open");
    };
    document.getElementById("copyOrder").onclick = function () {
      const when = document.getElementById("fWhen").value.trim() || "待补";
      const who = document.getElementById("fWho").value.trim() || "待补";
      const where = document.getElementById("fWhere").value;
      const need = document.getElementById("fNeed").value.trim() || "待补";
      const text = "小万订单\\n日期/航班：" + when + "\\n人数：" + who + "\\n在：" + where + "\\n要：" + need + "\\n联系：@pczZJ  +86 138 7663 6537";
      const go = function () {
        location.href = "https://t.me/pczZJ?text=" + encodeURIComponent(text.replace(/\\n/g, "\n"));
      };
      const plain = text.replace(/\\n/g, "\n");
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(plain).then(go, go);
      } else {
        go();
      }
    };

    async function ask(text) {
      const q = (text || input.value || "").trim();
      if (!q) return;
      input.value = "";
      add("user", q);
      sendBtn.disabled = true;
      history.push({ role: "user", content: q });
      const wait = document.createElement("div");
      wait.className = "msg bot hint";
      wait.textContent = lang === "ru" ? "Сяо Вань смотрит…" : "小万在看…";
      logEl.appendChild(wait);
      try {
        const res = await fetch("https://api.deepseek.com/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + KEY
          },
          body: JSON.stringify({
            model: "deepseek-flash",
            messages: history,
            stream: false,
            thinking: { type: "disabled" }
          })
        });
        const data = await res.json();
        wait.remove();
        if (!res.ok) {
          add("assistant", lang === "ru" ? "Сейчас не отвечает. Напишите @pczZJ." : "小万暂时接不上。发 Telegram @pczZJ。", "bot err");
          sendBtn.disabled = false;
          return;
        }
        const reply = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || (lang === "ru" ? "Повторите, пожалуйста." : "再发一次。");
        history.push({ role: "assistant", content: reply });
        add("assistant", reply);
      } catch (e) {
        wait.remove();
        add("assistant", lang === "ru" ? "Нет сети. Напишите @pczZJ." : "网络没通上。发 Telegram @pczZJ。", "bot err");
      }
      sendBtn.disabled = false;
      logEl.scrollTop = logEl.scrollHeight;
    }

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      ask();
    });
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        ask();
      }
    });

    paint();
    add("assistant", t().hi);
    applyKnowledge(localFacts());
    publishedFacts().then(function (pub) {
      applyKnowledge(pub.concat(localFacts()));
    });
  </script>
</body>
</html>
