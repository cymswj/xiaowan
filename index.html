<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a3a4a" />
  <title>小万 · 万国助手</title>
  <meta name="description" content="小万：三亚接机、翻译、用车，也可帮订万国酒店和万国公寓。" />
  <style>
    :root {
      --bg: #f3eee4;
      --ink: #1a3340;
      --muted: #5d6e76;
      --paper: #fffdf8;
      --line: #e4d9c8;
      --sea: #1a3a4a;
      --brass: #b8924a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
    body {
      font: 16px/1.5 "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
      display: flex; flex-direction: column;
    }
    header {
      flex: none;
      background: var(--sea);
      color: var(--paper);
      padding: 16px 18px 12px;
      padding-top: max(16px, env(safe-area-inset-top));
    }
    .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .brand { margin: 0; font-size: 11px; letter-spacing: .18em; color: var(--brass); }
    h1 { margin: 6px 0 0; font-size: 26px; font-weight: 650; }
    .sub { margin: 4px 0 0; opacity: .85; font-size: 13px; }
    .lang {
      border: 1px solid rgba(255,253,248,.35);
      background: transparent;
      color: var(--paper);
      border-radius: 999px;
      padding: 6px 10px;
      font: inherit;
      font-size: 12px;
    }
    .log { flex: 1; overflow: auto; padding: 16px 16px 8px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 86%; padding: 10px 12px; border-radius: 16px; white-space: pre-wrap; word-break: break-word; }
    .bot { align-self: flex-start; background: var(--paper); border: 1px solid var(--line); }
    .me { align-self: flex-end; background: var(--sea); color: var(--paper); }
    .hint { align-self: center; color: var(--muted); font-size: 12px; text-align: center; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 8px; }
    .chips button, .orderbar button, .sheet button {
      border: 1px solid var(--line); background: var(--paper); color: var(--ink);
      border-radius: 999px; padding: 7px 12px; font: inherit; font-size: 13px;
    }
    .orderbar { padding: 0 16px 8px; display: flex; gap: 8px; }
    .orderbar button.main, form.bar button, .sheet .go {
      border: 0; background: var(--sea); color: var(--paper); border-radius: 14px; font-weight: 700;
    }
    form.bar {
      flex: none; display: flex; gap: 8px;
      padding: 10px 16px calc(12px + env(safe-area-inset-bottom));
      background: var(--paper); border-top: 1px solid var(--line);
    }
    textarea, .sheet input, .sheet select {
      width: 100%; border: 1px solid var(--line); background: var(--bg);
      border-radius: 12px; padding: 10px 12px; font: inherit;
    }
    form.bar textarea { flex: 1; resize: none; min-height: 44px; max-height: 120px; width: auto; }
    form.bar button { min-width: 72px; }
    form.bar button:disabled { opacity: .5; }
    .err { color: #8a3030; font-size: 13px; }
    footer { text-align: center; color: var(--muted); font-size: 11px; padding: 0 16px 8px; }
    .sheet { display: none; padding: 0 16px 8px; }
    .sheet.open { display: grid; gap: 8px; }
    .sheet label { font-size: 12px; color: var(--muted); }
    .msg a { color: #1a5c8a; text-decoration: underline; word-break: break-all; }
    .me a { color: #dbeafe; }
  </style>
</head>
<body>
  <header>
    <div class="top">
      <div>
        <p class="brand" id="brand">海南万国大健康</p>
        <h1 id="title">小万</h1>
        <p class="sub" id="sub">先说在哪、哪天到。凌晨航班也能接。</p>
      </div>
      <button class="lang" type="button" id="langBtn">RU</button>
    </div>
  </header>
  <div id="log" class="log"></div>
  <div id="chips" class="chips"></div>
  <div class="orderbar">
    <button type="button" class="main" id="openOrder">发给接待</button>
  </div>
  <div class="sheet" id="sheet">
    <label id="lDate">日期 / 航班</label>
    <input id="fWhen" placeholder="10月3日  SU204  02:10" />
    <label id="lWho">人数</label>
    <input id="fWho" placeholder="2 成人" />
    <label id="lWhere">在哪</label>
    <select id="fWhere">
      <option value="三亚">三亚</option>
      <option value="海口">海口</option>
      <option value="博鳌">博鳌</option>
    </select>
    <label id="lNeed">要什么</label>
    <input id="fNeed" placeholder="接机 + 送到大东海" />
    <button type="button" class="go" id="copyOrder">复制并打开 Telegram</button>
  </div>
  <form class="bar" id="form">
    <textarea id="input" rows="1" placeholder="在哪、哪天到、要什么"></textarea>
    <button type="submit" id="send">发送</button>
  </form>
  <footer>Telegram / WhatsApp @pczZJ · +86 138 7663 6537</footer>
  <script src="./app.js"></script>
</body>
</html>
