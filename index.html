<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a3a4a" />
  <title>小万 · 万国助手</title>
  <meta name="description" content="小万是海南万国大健康的客服助手。接机、翻译、用车、公寓。" />
  <style>
    :root {
      --bg: #f3eee4;
      --ink: #1a3340;
      --muted: #5d6e76;
      --paper: #fffdf8;
      --line: #e4d9c8;
      --sea: #1a3a4a;
      --brass: #b8924a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
    body {
      font: 16px/1.5 "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
      display: flex; flex-direction: column;
    }
    header {
      flex: none;
      background: var(--sea);
      color: var(--paper);
      padding: 16px 18px 14px;
      padding-top: max(16px, env(safe-area-inset-top));
    }
    .brand { margin: 0; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--brass); }
    h1 { margin: 6px 0 0; font-size: 26px; font-weight: 650; }
    .sub { margin: 4px 0 0; opacity: .8; font-size: 13px; }
    .log {
      flex: 1;
      overflow: auto;
      padding: 16px 16px 8px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      max-width: 86%;
      padding: 10px 12px;
      border-radius: 16px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .bot { align-self: flex-start; background: var(--paper); border: 1px solid var(--line); }
    .me { align-self: flex-end; background: var(--sea); color: var(--paper); }
    .hint { align-self: center; color: var(--muted); font-size: 12px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 8px; }
    .chips button {
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--ink);
      border-radius: 999px;
      padding: 7px 12px;
      font: inherit;
      font-size: 13px;
    }
    form.bar {
      flex: none;
      display: flex;
      gap: 8px;
      padding: 10px 16px calc(12px + env(safe-area-inset-bottom));
      background: var(--paper);
      border-top: 1px solid var(--line);
    }
    textarea {
      flex: 1;
      resize: none;
      min-height: 44px;
      max-height: 120px;
      border: 1px solid var(--line);
      background: var(--bg);
      border-radius: 14px;
      padding: 10px 12px;
      font: inherit;
    }
    form.bar button {
      border: 0;
      background: var(--sea);
      color: var(--paper);
      border-radius: 14px;
      min-width: 72px;
      font-weight: 700;
    }
    form.bar button:disabled { opacity: .5; }
    .err { color: #8a3030; font-size: 13px; }
    footer { text-align: center; color: var(--muted); font-size: 11px; padding: 0 16px 8px; }
  </style>
</head>
<body>
  <header>
    <p class="brand">海南万国大健康</p>
    <h1>小万</h1>
    <p class="sub">接机、翻译、用车、公寓。先问，再安排。</p>
  </header>

  <div id="log" class="log"></div>
  <div id="chips" class="chips"></div>

  <form class="bar" id="form">
    <textarea id="input" rows="1" placeholder="跟小万说：几个人、哪天、要什么"></textarea>
    <button type="submit" id="send">发送</button>
  </form>
  <footer>Telegram / WhatsApp @pczZJ · +86 138 7663 6537</footer>

  <script>
    const KEY = "sk-18a86ed64055424aa11284d4ffc58c3b";
    const RULES = [
      "你是小万，海南万国大健康投资有限公司的客服助手。",
      "用客人使用的语言回答。中文就中文，俄语就俄语，短句，不客套堆砌。",
      "下面「已教内容」优先于泛泛说法。有冲突时用更新、更具体的那条。",
      "不知道空房或价格时，不要编数字，让客人发 Telegram / WhatsApp @pczZJ 或电话 +86 138 7663 6537 问当天。",
      "不要谈公司内部指标、药品代发、未建成医院。不承诺疗效，不售药。"
    ].join("");
    const CHIPS = ["明天接机", "要翻译", "问公寓", "去博鳌", "Как доехать"];

    const logEl = document.getElementById("log");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const chipsEl = document.getElementById("chips");
    const history = [{ role: "system", content: RULES }];

    function localFacts() {
      try {
        return (JSON.parse(localStorage.getItem("xiaowan_kb") || "[]") || [])
          .map(function (x) { return x && x.text; })
          .filter(Boolean);
      } catch (e) { return []; }
    }

    async function publishedFacts() {
      try {
        const res = await fetch("./knowledge.json?t=" + Date.now());
        if (!res.ok) return [];
        const data = await res.json();
        return data.items || [];
      } catch (e) { return []; }
    }

    function applyKnowledge(items) {
      const extra = items.filter(Boolean);
      history[0].content = RULES + (extra.length ? "\n\n已教内容：\n- " + extra.join("\n- ") : "");
    }

    function add(role, text, cls) {
      const div = document.createElement("div");
      div.className = "msg " + (cls || (role === "user" ? "me" : "bot"));
      div.textContent = text;
      logEl.appendChild(div);
      logEl.scrollTop = logEl.scrollHeight;
    }

    add("assistant", "我是小万。可以说接机、翻译、用车、订公寓。写人数和日期就行。");
    CHIPS.forEach(function (c) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = c;
      b.onclick = function () { input.value = c; ask(c); };
      chipsEl.appendChild(b);
    });
    applyKnowledge(localFacts());
    publishedFacts().then(function (pub) {
      applyKnowledge(pub.concat(localFacts()));
    });

    async function ask(text) {
      const q = (text || input.value || "").trim();
      if (!q) return;
      input.value = "";
      add("user", q);
      sendBtn.disabled = true;
      history.push({ role: "user", content: q });
      const wait = document.createElement("div");
      wait.className = "msg bot hint";
      wait.textContent = "小万在看…";
      logEl.appendChild(wait);
      try {
        const res = await fetch("https://api.deepseek.com/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + KEY
          },
          body: JSON.stringify({
            model: "deepseek-flash",
            messages: history,
            stream: false,
            thinking: { type: "disabled" }
          })
        });
        const data = await res.json();
        wait.remove();
        if (!res.ok) {
          add("assistant", "小万暂时接不上。稍后再试，或发 Telegram @pczZJ。", "bot err");
          sendBtn.disabled = false;
          return;
        }
        const reply = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || "我这边没接到字。再发一次。";
        history.push({ role: "assistant", content: reply });
        add("assistant", reply);
      } catch (e) {
        wait.remove();
        add("assistant", "网络没通上。换个网络再试，或发 Telegram @pczZJ。", "bot err");
      }
      sendBtn.disabled = false;
      logEl.scrollTop = logEl.scrollHeight;
    }

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      ask();
    });
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        ask();
      }
    });
  </script>
</body>
</html>
